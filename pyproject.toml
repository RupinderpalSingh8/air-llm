[project]
name = "air-llm-bench"
version = "0.1.0"
description = "Compare AirLLM and local Ollama calls, traced with OpenTelemetry."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "airllm",
    "ollama",
    "openinference-instrumentation-ollama",
    "openinference-semantic-conventions",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "psutil",
    "python-dotenv",
    "torch>=2.4",
]

[project.scripts]
compare-llms = "air_llm_bench.compare:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/air_llm_bench"]

[tool.hatch.build.targets.wheel.sources]
"src/air_llm_bench" = "air_llm_bench"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

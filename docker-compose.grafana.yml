# Grafana and Tempo. Kept so TRACE_BACKEND=grafana has a collector to point at.
# This file is not started by the comparison. Start it yourself only after
# stopping anything else bound to 4317/4318:
#   docker compose -f docker-compose.grafana.yml up -d

name: airllm-grafana

services:
  tempo:
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - 127.0.0.1:4317:4317
      - 127.0.0.1:4318:4318
    volumes:
      - ./grafana/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  grafana:
    image: grafana/grafana:11.5.2
    ports:
      - 127.0.0.1:3001:3000
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - tempo

volumes:
  tempo-data:
